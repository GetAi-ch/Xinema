name: Build Xinema plugins
on:
  push:
    branches: [main]
    paths-ignore: ["*.md"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build CloudStream plugins
        run: gradle make makePluginsJson
      - name: Collect manifest and plugin packages
        run: |
          mkdir -p dist
          cp build/plugins.json dist/plugins.json
          cat > dist/repo.json <<'EOF'
          {
            "name": "Xinema",
            "description": "Xinema CloudStream Repository",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/GetAi-ch/Xinema/builds/plugins.json"
            ]
          }
          EOF
          find . -type f -name '*.cs3' -exec cp {} dist/ \;
          test -s dist/plugins.json
          test -s dist/repo.json
          ls -lah dist
      - name: Publish to builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: builds
          publish_dir: dist
          github_token: ${{ secrets.GITHUB_TOKEN }}
          keep_files: false
          force_orphan: true